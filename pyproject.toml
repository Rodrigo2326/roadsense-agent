[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense"
version = "0.1.0"
description = "RoadSense - an evidence-seeking visual agent using Strands Decider 2B for sequential tool selection and Amazon Bedrock for grounded answers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# El modelo Decider 2B corre localmente (adapter LoRA de HuggingFace, no esta en Bedrock).
decider = ["strands-decider>=0.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
roadsense = "roadsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
